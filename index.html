<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Practice 2</title>
</head>
<body>
    <h1>Switch Statement</h1>

    <script>
        let team = "Yellow"; //string

        switch (team){
            case "Yellow":
                alert("Go Yellow Tigers! For the Win!");
                break;
            case "Blue":
                alert("Blue Bears!");
                break;
            case "Red":
                alert("Red Bulldogs!");
                break;
            case "Green":
                alert("Green Hornets!");
                break;
            default:
                alert("Team could not be determined.");
        }
    </script>
    
</body>
</html>
