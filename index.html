<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Practice 2</title>
</head>
<body>
    <h1>Switch Statement</h1>


    <button class="btn btn-info" onclick = "teamRank()">Rank</button>

    <script>
        function teamRank(){
        var rank = "1st";

        message = "";

        switch(true){
            case(rank === "1st"):rank: //compare
                message = "Champions!";
                break;
            case(rank === "2nd"):rank: //compare
                message = "Second Placer";
                break;
            case(rank === "3nd"):rank: //compare
                message = "Third Placer";
                break;
            case(rank === "4th"):rank: //compare
                message = "Fourth Placer";
                break;
            default:
                message = "Rank not available at this time.";


        }
        alert(message);
    }

        let team = "Yellow"; //string

        switch (team){
            case "Yellow":
                alert("Go Yellow Tigers! For the Win!");
                break;
            case "Blue":
                alert("Blue Bears!");
                break;
            case "Red":
                alert("Red Bulldogs!");
                break;
            case "Green":
                alert("Green Hornets!");
                break;
            default:
                alert("Team could not be determined.");
        }
    </script>
    
</body>
</html>
